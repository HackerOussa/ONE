<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration</title><link rel="stylesheet" href="style.css"></head>
<body data-page="admin"><main class="wrap"><header><a class="logo brand" href="/"></a><span id="st" class="tag"></span></header>
<h2>Demandes d'adhésion</h2><div style="overflow-x:auto"><table><thead><tr><th>Nom</th><th>Contact</th><th>Durée</th><th>Statut</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<h2>Publier un contenu</h2><form id="lf"><select name="course_idx" id="ci"></select><input name="title" placeholder="Titre de la leçon" required><input name="video_url" placeholder="Lien vidéo"><input name="file_url" placeholder="Lien du document"><button class="btn">Publier</button><p class="msg" id="lm"></p></form>
<h2>Inviter un mentor ou un admin</h2><form id="sf"><input name="name" placeholder="Nom" required><input name="email" type="email" placeholder="Email" required><select name="role"><option value="mentor">Mentor</option><option value="admin">Admin</option></select><button class="btn">Envoyer l'invitation</button><p class="msg" id="sm"></p></form></main><script src="app.js"></script></body></html>
